# Bot configuration. The Discord token should come from the environment, never committed.
config.token=${DISCORD_TOKEN:}
config.prefix=!
config.game=

# H2 file-mode database so saves survive restarts. DATABASE_TO_UPPER=false keeps column names as-is.
spring.datasource.url=jdbc:h2:file:./database;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Flyway manages schema migrations under db/migration.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.application.name=delve
