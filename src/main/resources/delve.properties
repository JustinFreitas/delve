# Bot configuration. The Discord token should come from the environment, never committed.
config.token=${DISCORD_TOKEN:}
config.prefix=!
config.game=

# H2 file-mode database so saves survive restarts. DATABASE_TO_UPPER=false keeps column names as-is.
spring.datasource.url=jdbc:h2:file:./database;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Flyway manages schema migrations under db/migration.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.application.name=delve

# --- Optional web interface (off by default; the bot runs headless) -------------------------------
# Bot-only is fully headless: web-application-type=none means NO embedded server / Spring MVC /
# OAuth2 web autoconfig loads at all. delve.config.js (PM2) flips WEB_APP_TYPE to servlet and injects
# the Discord OAuth registration only when WEB_ENABLED=true AND credentials are present, so Spring
# Boot never eagerly validates an empty OAuth client id.
spring.main.web-application-type=${WEB_APP_TYPE:none}

config.web.enabled=${WEB_ENABLED:false}
# Empty = any logged-in Discord user may play; comma-separated ids restrict a public instance.
config.web.allowed-user-ids=${WEB_ALLOWED_USER_IDS:}
config.web.admin-user-ids=${WEB_ADMIN_USER_IDS:}
config.web.requests-per-minute=120

# Embedded server (used only when web is enabled). Behind a TLS-terminating reverse proxy keep
# forward-headers so OAuth redirect URLs resolve to https://.
server.port=${WEB_PORT:8080}
server.forward-headers-strategy=framework
# Secure session cookie (the 'secure' flag should be on once you're behind HTTPS).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${WEB_COOKIE_SECURE:false}

# Discord OAuth2 *provider* endpoints (static; harmless when no registration is configured). The
# *registration* (client id/secret/scope/redirect) is NOT defined here — Boot validates it eagerly
# and would reject an empty client id. It is injected via env by delve.config.js when web is enabled,
# or set directly with SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_DISCORD_CLIENT_ID etc.
spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/users/@me
# Discord's /users/@me .id IS the same id JDA uses — this is what makes the web save shared with the bot.
spring.security.oauth2.client.provider.discord.user-name-attribute=id
