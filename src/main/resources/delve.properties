# Bot configuration. The Discord token should come from the environment, never committed.
config.token=${DISCORD_TOKEN:}
config.prefix=!
config.game=

# H2 file-mode database so saves survive restarts. DATABASE_TO_UPPER=false keeps column names as-is.
spring.datasource.url=jdbc:h2:file:./database;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Flyway manages schema migrations under db/migration.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.application.name=delve

# --- Optional web interface (off by default; the bot runs headless) -------------------------------
# Turn on with config.web.enabled=true and supply the Discord OAuth credentials below.
config.web.enabled=${WEB_ENABLED:false}
# Empty = any logged-in Discord user may play; comma-separated ids restrict a public instance.
config.web.allowed-user-ids=${WEB_ALLOWED_USER_IDS:}
config.web.requests-per-minute=120

# Embedded server. Behind a TLS-terminating reverse proxy (recommended for public deployment),
# keep forward-headers so OAuth redirect URLs resolve to https://.
server.port=${WEB_PORT:8080}
server.forward-headers-strategy=framework
# Secure session cookie (the 'secure' flag should be on once you're behind HTTPS).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${WEB_COOKIE_SECURE:false}

# Discord as an OAuth2 login provider. Create a Discord application (Developer Portal),
# add redirect URI <base-url>/login/oauth2/code/discord, and supply id/secret via env.
spring.security.oauth2.client.registration.discord.client-id=${DISCORD_OAUTH_CLIENT_ID:}
spring.security.oauth2.client.registration.discord.client-secret=${DISCORD_OAUTH_CLIENT_SECRET:}
spring.security.oauth2.client.registration.discord.client-name=Discord
spring.security.oauth2.client.registration.discord.scope=identify
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.discord.redirect-uri={baseUrl}/login/oauth2/code/discord
spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/users/@me
# Discord's /users/@me .id IS the same id JDA uses — this is what makes the web save shared with the bot.
spring.security.oauth2.client.provider.discord.user-name-attribute=id
